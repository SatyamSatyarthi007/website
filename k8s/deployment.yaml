apiVersion: apps/v1
kind: Deployment
metadata:
  name: vauclaire-website
  labels:
    app: vauclaire-website
spec:
  replicas: 2
  selector:
    matchLabels:
      app: vauclaire-website
  template:
    metadata:
      labels:
        app: vauclaire-website
    spec:
      containers:
        - name: website
          image: vauclaire-website:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: NODE_ENV
              value: production
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
